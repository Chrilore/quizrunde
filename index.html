<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quizrunde</title>
<style>
:root{--bg:#1B1340;--ink:#FFF8E7;--mut:#B9B0E0;--panel:#2A2060;--c0:#2E5BFF;--c1:#FFB400;--c2:#14B88A;--c3:#E5307C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 18px/1.4 system-ui,"Segoe UI",sans-serif}
main{max-width:900px;margin:0 auto;padding:24px 16px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
section{display:none;flex-direction:column;gap:16px}
section.on{display:flex}
h1{font-size:clamp(34px,9vw,60px);line-height:1.05;margin:0;font-weight:900}
h2{font-size:clamp(24px,5vw,38px);line-height:1.2;margin:0;font-weight:800}
input,textarea{width:100%;font:inherit;padding:14px 16px;border-radius:12px;border:3px solid var(--panel);background:var(--panel);color:var(--ink)}
textarea{min-height:280px;font:500 15px/1.5 ui-monospace,Menlo,Consolas,monospace}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
button{font:inherit;font-weight:800;padding:14px 22px;border:0;border-radius:12px;background:var(--c1);color:#1B1340;cursor:pointer}
button.sec{background:var(--panel);color:var(--ink)}
button[hidden]{display:none}
.pin{font-size:clamp(56px,17vw,130px);font-weight:900;letter-spacing:.06em;color:var(--c1);line-height:1}
.muted{color:var(--mut);font-weight:500}
.err{color:#FF8FB5;min-height:1.4em;margin:0}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names span{background:var(--panel);padding:6px 14px;border-radius:99px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;padding:18px 16px;border-radius:14px;color:#fff;font-weight:800;min-height:88px;text-align:left;width:100%}
.opt b{flex:none;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.25);display:grid;place-items:center}
.opt .n{margin-left:auto;font-size:28px}
.c0{background:var(--c0)}.c1{background:var(--c1);color:#1B1340}.c2{background:var(--c2)}.c3{background:var(--c3)}
.opt.dim{opacity:.3}
.track{height:12px;border-radius:99px;background:var(--panel);overflow:hidden}
#bar{height:100%;width:100%;background:var(--c1)}
.row{display:flex;gap:12px;flex-wrap:wrap}
ol{margin:0;padding-left:1.4em}
li{padding:4px 0}
.big{font-size:clamp(40px,12vw,80px);font-weight:900;line-height:1.05;margin:0}
.ok{color:var(--c2)}.bad{color:var(--c3)}
@media(prefers-reduced-motion:reduce){#bar{transition:none!important}}
</style>
</head>
<body>
<main>

<section id="home" class="on">
  <h1>Quizrunde</h1>
  <input id="pin" inputmode="numeric" maxlength="5" placeholder="Spielcode" autocomplete="off">
  <input id="name" maxlength="16" placeholder="Dein Name" autocomplete="off">
  <p class="err" id="jerr"></p>
  <div class="row">
    <button id="join">Beitreten</button>
    <button id="tohost" class="sec">Eigenes Quiz hosten</button>
  </div>
</section>

<section id="setup">
  <h2>Dein Quiz</h2>
  <p class="muted">Eine Frage pro Block, getrennt durch eine Leerzeile. Erste Zeile ist die Frage, danach 2 bis 4 Antworten. Die richtige Antwort beginnt mit *.</p>
  <textarea id="quiz" spellcheck="false"></textarea>
  <label class="muted">Sekunden pro Frage <input id="secs" type="number" min="5" max="60" value="20"></label>
  <p class="err" id="serr"></p>
  <div class="row">
    <button id="create">Spiel erstellen</button>
    <button class="sec" onclick="location.reload()">Zurück</button>
  </div>
</section>

<section id="hlobby">
  <p class="muted" id="where"></p>
  <div class="pin" id="showpin"></div>
  <h2 id="lobbycount">Warte auf Spieler</h2>
  <div class="names" id="names"></div>
  <div class="row"><button id="start" disabled>Spiel starten</button></div>
</section>

<section id="hq">
  <h2 id="qtext"></h2>
  <div class="track"><div id="bar"></div></div>
  <p class="muted" id="cnt"></p>
  <div class="grid" id="hopts"></div>
  <ol id="board" hidden></ol>
  <div class="row">
    <button id="skip" class="sec">Frage beenden</button>
    <button id="next" hidden>Nächste Frage</button>
  </div>
</section>

<section id="pwait">
  <h2>Du bist dabei.</h2>
  <p class="muted">Warte, bis der Host das Spiel startet.</p>
</section>

<section id="pq">
  <p class="muted" id="pqtext"></p>
  <div class="grid" id="popts"></div>
</section>

<section id="plocked">
  <h2>Antwort gesendet.</h2>
  <p class="muted">Warte auf die anderen.</p>
</section>

<section id="pres">
  <p class="big" id="presmain"></p>
  <h2 id="prespts"></h2>
  <p class="muted" id="presrank"></p>
</section>

<section id="end">
  <h1 id="endtitle"></h1>
  <ol id="endlist"></ol>
  <p class="muted" id="endsub"></p>
  <div class="row"><button onclick="location.reload()">Neue Runde</button></div>
</section>

<section id="gone">
  <h2 id="gonemsg"></h2>
  <div class="row"><button onclick="location.reload()">Zur Startseite</button></div>
</section>

</main>
<script>
const $ = id => document.getElementById(id);
const LET = 'ABCD';
const SAMPLE = `Welcher Planet ist der Sonne am nächsten?
Venus
*Merkur
Mars
Erde

Wie viele Kontinente gibt es?
*7
5
6
8

Wie heißt die Hauptstadt von Australien?
Sydney
Melbourne
*Canberra
Perth`;
let ws, role, ingame = false;

function show(id) { document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === id)); }
function gone(msg) { ingame = false; $('gonemsg').textContent = msg; show('gone'); }
function connect(onopen) {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = onopen;
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { if (ingame) gone('Verbindung getrennt.'); else if (!role) { $('jerr').textContent = $('serr').textContent = 'Keine Verbindung zum Server.'; } };
}
const tx = m => ws.send(JSON.stringify(m));

function parse(txt, time) {
  return txt.split(/\n\s*\n/).map(b => b.split('\n').map(s => s.trim()).filter(Boolean)).filter(l => l.length >= 3).map(l => {
    const o = l.slice(1, 5);
    return { text: l[0], options: o.map(x => x.replace(/^\*\s*/, '')), correct: o.findIndex(x => x.startsWith('*')), time };
  }).filter(q => q.correct >= 0);
}

function opts(box, options, clickable) {
  box.replaceChildren();
  options.forEach((o, i) => {
    const b = document.createElement(clickable ? 'button' : 'div');
    b.className = 'opt c' + i;
    const l = document.createElement('b'); l.textContent = LET[i];
    const t = document.createElement('span'); t.textContent = o;
    b.append(l, t);
    if (clickable) b.onclick = () => { tx({ t: 'answer', i }); show('plocked'); };
    box.append(b);
  });
}

function handle(m) {
  if (m.t === 'err') { if (ingame) return gone(m.msg); $('jerr').textContent = $('serr').textContent = m.msg; return; }
  if (m.t === 'hosting') {
    ingame = true; $('showpin').textContent = m.pin;
    $('where').textContent = 'Öffne ' + location.host + ' auf dem Handy und gib diesen Code ein:';
    show('hlobby');
  } else if (m.t === 'lobby') {
    $('names').replaceChildren(...m.names.map(n => { const s = document.createElement('span'); s.textContent = n; return s; }));
    $('lobbycount').textContent = m.names.length ? m.names.length + ' Spieler dabei' : 'Warte auf Spieler';
    $('start').disabled = !m.names.length;
  } else if (m.t === 'joined') {
    ingame = true; show('pwait');
  } else if (m.t === 'q') {
    if (role === 'host') {
      $('qtext').textContent = (m.idx + 1) + '/' + m.total + '  ' + m.text;
      opts($('hopts'), m.options, false);
      $('board').hidden = true; $('next').hidden = true; $('skip').hidden = false;
      $('cnt').textContent = '0 Antworten';
      const bar = $('bar'); bar.style.transition = 'none'; bar.style.width = '100%'; bar.offsetWidth;
      bar.style.transition = 'width ' + m.time + 's linear'; bar.style.width = '0%';
      show('hq');
    } else {
      $('pqtext').textContent = m.text;
      opts($('popts'), m.options, true);
      show('pq');
    }
  } else if (m.t === 'count') {
    $('cnt').textContent = m.n + ' von ' + m.of + ' haben geantwortet';
  } else if (m.t === 'reveal') {
    document.querySelectorAll('#hopts .opt').forEach((o, i) => {
      o.classList.toggle('dim', i !== m.correct);
      const n = document.createElement('span'); n.className = 'n'; n.textContent = m.counts[i]; o.append(n);
    });
    $('bar').style.transition = 'none';
    $('board').replaceChildren(...m.top.map(p => { const li = document.createElement('li'); li.textContent = p.name + ': ' + p.score; return li; }));
    $('board').hidden = false; $('skip').hidden = true; $('next').hidden = false;
    $('next').textContent = m.last ? 'Endergebnis' : 'Nächste Frage';
  } else if (m.t === 'result') {
    const main = $('presmain');
    main.textContent = m.correct ? 'Richtig!' : (m.answered ? 'Leider falsch' : 'Keine Antwort');
    main.className = 'big ' + (m.correct ? 'ok' : 'bad');
    $('prespts').textContent = m.correct ? '+' + m.pts + ' Punkte' : '+0 Punkte';
    $('presrank').textContent = 'Platz ' + m.rank + ' von ' + m.of + ' mit ' + m.score + ' Punkten';
    show('pres');
  } else if (m.t === 'end') {
    ingame = false;
    if (role === 'host') {
      $('endtitle').textContent = 'Endergebnis';
      $('endlist').replaceChildren(...m.top.map(p => { const li = document.createElement('li'); li.textContent = p.name + ': ' + p.score; return li; }));
      $('endsub').textContent = '';
    } else {
      $('endtitle').textContent = 'Platz ' + m.rank + ' von ' + m.of;
      $('endlist').replaceChildren();
      $('endsub').textContent = m.score + ' Punkte';
    }
    show('end');
  }
}

$('quiz').value = SAMPLE;
$('tohost').onclick = () => show('setup');
$('join').onclick = () => {
  const pin = $('pin').value.trim(), name = $('name').value.trim();
  if (!pin || !name) { $('jerr').textContent = 'Bitte Code und Namen eingeben.'; return; }
  $('jerr').textContent = ''; role = 'player';
  connect(() => tx({ t: 'join', pin, name }));
};
$('create').onclick = () => {
  const quiz = parse($('quiz').value, Number($('secs').value) || 20);
  if (!quiz.length) { $('serr').textContent = 'Mindestens eine Frage mit 2 bis 4 Antworten, die richtige mit * markiert.'; return; }
  $('serr').textContent = ''; role = 'host';
  connect(() => tx({ t: 'host', quiz }));
};
$('start').onclick = () => tx({ t: 'start' });
$('skip').onclick = () => tx({ t: 'skip' });
$('next').onclick = () => tx({ t: 'next' });
</script>
</body>
</html>
